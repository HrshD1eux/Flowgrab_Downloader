name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump Version Dynamically
        id: bump
        run: |
          node scripts/bump.js
          NEW_VER=$(node -p "require('./package.json').version")
          echo "version=$NEW_VER" >> $GITHUB_OUTPUT
          echo "Next Dynamic Release Version: $NEW_VER"

      - name: Commit and Push Bumped Version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml README.md docs/index.html website/index.html
          git commit -m "chore(release): bump version to v${{ steps.bump.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push origin main

  release:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull Latest Main Commit
        run: git pull origin main

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf ffmpeg

      - name: Setup Linux Sidecar Binaries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/binaries
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o src-tauri/binaries/yt-dlp-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/yt-dlp-x86_64-unknown-linux-gnu

      - name: Setup Windows Sidecar Binaries
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe")) {
            New-Item -ItemType Directory -Force -Path "src-tauri/binaries"
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe"
          }

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Next.js Frontend
        run: npm run build

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: 'Flowgrab Downloader v${{ needs.prepare.outputs.version }}'
          releaseBody: 'See the release assets below to download Flowgrab Downloader v${{ needs.prepare.outputs.version }} for Windows (.msi, .exe) and Linux (.deb, .AppImage).'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
